name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - run: python -m pip check
      - run: python -m pip_audit --strict .
      - run: python -m ruff check app tests
      - run: python -m mypy app
      - run: python -m pytest --cov=app --cov-report=term-missing
      - run: python -m app.reporting.docs_pdf --docs-root ../docs --output-dir ../generated-docs
      - name: Vérifier les migrations SQLite
        env:
          DIGITALFOOTPRINT_DATABASE_URL: sqlite:////tmp/digitalfootprint-ci.db
          DIGITALFOOTPRINT_SECRET_KEY: ci-only-synthetic-secret-at-least-32-characters
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade -1
          python -m alembic upgrade head
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-pdf
          path: generated-docs/*.pdf
          if-no-files-found: error
          retention-days: 7

  migrations-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: digitalfootprint
          POSTGRES_USER: digitalfootprint
          POSTGRES_PASSWORD: ci-postgres-synthetic-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digitalfootprint -d digitalfootprint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DIGITALFOOTPRINT_DATABASE_URL: postgresql+psycopg://digitalfootprint:ci-postgres-synthetic-password@127.0.0.1:5432/digitalfootprint
      DIGITALFOOTPRINT_TEST_POSTGRES_BACKUP_URL: postgresql+psycopg://digitalfootprint:ci-postgres-synthetic-password@127.0.0.1:5432/digitalfootprint
      DIGITALFOOTPRINT_SECRET_KEY: ci-only-synthetic-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Tester le cycle complet des migrations PostgreSQL
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic current
          python -m pytest -q tests/test_database_archive.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm audit --audit-level=high
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --disable-pip-version-check -e backend
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Conserver le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration Compose
        env:
          DIGITALFOOTPRINT_SECRET_KEY: ci-only-synthetic-secret-at-least-32-characters
        run: docker compose config --quiet
      - run: docker build --file deploy/docker/backend.Dockerfile --tag digitalfootprint-backend:ci .
      - run: docker build --file deploy/docker/frontend.Dockerfile --tag digitalfootprint-frontend:ci .

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: docker
    env:
      DIGITALFOOTPRINT_SECRET_KEY: ci-only-synthetic-secret-at-least-32-characters
      DIGITALFOOTPRINT_HTTP_PORT: "18080"
      COMPOSE_PROJECT_NAME: digitalfootprint-ci
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait
      - run: curl --fail --silent --show-error http://127.0.0.1:18080/health
      - name: Arrêter l'environnement de test
        if: always()
        run: docker compose down --volumes --remove-orphans
